name: medilink_ai
description: MediLink AI - Integrated Healthcare Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.3.6
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.1.1
  
  # Local Storage
  shared_preferences: ^2.0.17
  sqflite: ^2.2.8+4
  
  # Authentication & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.1
  crypto: ^3.0.3
  
  # Maps & Location
  google_maps_flutter: ^2.2.5
  geolocator: ^9.0.2
  geocoding: ^2.0.5
  
  # Push Notifications
  
  # UI Components
  flutter_svg: ^2.0.2
  lottie: ^2.3.2
  intl: ^0.20.2
  
  # Camera & Image
  image_picker: ^0.8.8
  camera: ^0.10.5
  
  # Video & Audio
  video_player: ^2.4.10
  
  # QR Code
  qr_flutter: ^4.0.0
  qr_code_scanner: ^1.0.1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Logging
  logger: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  

  
  generate: true
